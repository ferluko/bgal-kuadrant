# Cluster DESTINO (OCP) — backend mínimo para probar el flujo end-to-end.
#
# echo-server simple, mismo patrón usado del otro lado (poc-egress-kuadrant/
# destino-eks.yaml): runAsNonRoot debe ir en false porque la imagen corre como
# root por defecto (verificado empíricamente en EKS, mismo motivo aplica acá).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: poc-ingress-kuadrant
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: echo-server
          image: ealen/echo-server:0.9.2
          env:
            - name: PORT
              value: "8080"
            - name: ENABLE__ENVIRONMENT
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: poc-ingress-kuadrant
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: server-port
      port: 8080
      targetPort: 8080
