# Cluster ORIGEN (EKS) — Service ADITIVO hacia los pods reales de backend.
#
# Mismo patrón que poc-egress-kuadrant/origen/06-service-backend-local.yaml,
# roles invertidos. No modifica nada existente: crea un segundo Service que
# selecciona exactamente los mismos pods que hoy selecciona `backend`. El
# Deployment backend NO se toca.
#
# APLICAR EN LA ETAPA A, antes del cutover (09).
apiVersion: v1
kind: Service
metadata:
  name: backend-local
  namespace: poc-ingress-kuadrant
  labels:
    poc.galicia.io/rol: backend-local-canary
spec:
  type: ClusterIP
  # <<< AJUSTAR al selector real del Service backend en EKS antes del cutover
  selector:
    app: backend
  ports:
    - name: server-port
      port: 8080
      targetPort: 8080
      protocol: TCP
      appProtocol: http
---
# Verificación — tiene que devolver las MISMAS IPs que el Service backend actual:
#   kubectl -n poc-ingress-kuadrant get endpointslice -l kubernetes.io/service-name=backend-local \
#     -o jsonpath='{.items[*].endpoints[*].addresses[*]}{"\n"}'
#   kubectl -n poc-ingress-kuadrant get endpointslice -l kubernetes.io/service-name=backend \
#     -o jsonpath='{.items[*].endpoints[*].addresses[*]}{"\n"}'
