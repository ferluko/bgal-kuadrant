# Cluster ORIGEN (EKS) — control de quién puede pedirle un JWT al gateway de
# egreso. Mismo patrón que poc-egress-kuadrant/origen/07, roles invertidos.
#
# Como la autenticación de entrada al gateway es anonymous, la NetworkPolicy es
# el control efectivo: sólo los pods de `bff` pueden alcanzar el listener 8080
# del gateway de egreso.
#
# A diferencia del origen OCP (origen/07 del otro sentido, que necesita un
# ipBlock extra porque su propio ingress es hostNetwork y ve la IP del nodo),
# acá el ingress de entrada a `bff` es un Gateway con NLB target-type=ip, que
# preserva la IP real del pod/cliente — no hace falta el caso especial de
# ipBlock por IP de nodo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-to-egress-gw
  namespace: poc-ingress-kuadrant
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: egress-gw
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bff        # <<< AJUSTAR a las labels reales del pod bff
      ports:
        - protocol: TCP
          port: 8080
---
# Egreso del pod bff: sólo hacia el gateway y DNS. Tras el cutover el pod bff
# ya no habla directo con los pods de backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-egress-only-to-gw
  namespace: poc-ingress-kuadrant
spec:
  podSelector:
    matchLabels:
      app: bff                # <<< AJUSTAR
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: egress-gw
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Camino local del canary: durante las fases 0-3 el gateway devuelve parte del
# tráfico a los pods de backend vía el Service backend-local.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-gw-to-backend-local
  namespace: poc-ingress-kuadrant
spec:
  podSelector:
    matchLabels:
      app: backend               # <<< AJUSTAR a las labels reales del pod backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: egress-gw
      ports:
        - protocol: TCP
          port: 8080
