# Cluster ORIGEN (EKS, devops-cilium-1-35) — Gateway de egreso dedicado.
#
# Mirror de poc-egress-kuadrant/origen/01-gateway-egress.yaml con los roles
# invertidos: acá EKS es el origen y OCP es el destino.
#
# Vive en el mismo namespace que la app para que el "secreto de firma" quede
# local al ns — mismo requisito que en el otro sentido: Authorino sólo lee
# Secrets del ns del AuthConfig (kuadrant-system), no del ns del AuthPolicy.
#
# El listener es HTTP:8080 porque el cliente (bff) sigue hablando texto plano
# contra "backend.poc-ingress-kuadrant.svc.cluster.local:8080". El TLS hacia el
# cluster destino lo origina el gateway (ver 04-destinationrule-tls.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egress-gw
  namespace: poc-ingress-kuadrant
  labels:
    kuadrant.io/gateway: "true"
  annotations:
    # OBLIGATORIO. Sin esto el AWS Load Balancer Controller provisiona un NLB
    # real para un gateway que sólo debería ser alcanzable desde adentro del
    # cluster (su AuthPolicy es `anonymous`; cualquiera que llegue al listener
    # obtendría un JWT firmado — la NetworkPolicy (07) es el control real).
    # A diferencia del origen OCP (donde ClusterIP es forzoso porque no hay LB
    # provisto en IPI vSphere), acá SÍ habría un LB real si no se fuerza esto.
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: mesh-internal
      protocol: HTTP
      port: 8080
      # Sin hostname: las HTTPRoutes definen las variantes admitidas del Host
      # (FQDN y formas abreviadas como `backend`).
      allowedRoutes:
        namespaces:
          from: Same
---
# Verificación:
#   kubectl -n poc-ingress-kuadrant get gateway egress-gw \
#     -o jsonpath='{.status.conditions[?(@.type=="Programmed")].message}{"\n"}'
#
#   # los pods DEBEN quedar en este namespace: es lo que permite que el Service
#   # backend los seleccione en el cutover (09).
#   kubectl -n poc-ingress-kuadrant get pods -l gateway.networking.k8s.io/gateway-name=egress-gw
#   kubectl -n poc-ingress-kuadrant get svc  -l gateway.networking.k8s.io/gateway-name=egress-gw
#
# El Service DEBE salir TYPE=ClusterIP y sin NLB. A diferencia de OCP (istiod
# gestionado, no propaga labels/annotations por defecto — ver poc-egress-kuadrant/
# destino/10-gateway-ingress.yaml), en EKS el Istio upstream SÍ propaga labels/
# annotations del Gateway a los recursos generados por defecto — confirmarlo
# igual antes de asumirlo:
#   kubectl -n poc-ingress-kuadrant get svc -l gateway.networking.k8s.io/gateway-name=egress-gw -o yaml
