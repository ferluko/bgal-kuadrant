# Cluster ORIGEN (EKS) — ruta de egreso (estado base: 100% al cluster destino).
#
# Mismo patrón que poc-egress-kuadrant/origen/03, roles invertidos.
#
# NO hay filtro URLRewrite del Host, a propósito — mismo motivo documentado del
# otro lado (istio#39136: no hay filtros a nivel de backendRef, y con dos
# backends en la rule un filtro a nivel rule aplicaría a los dos). El Host
# viaja sin reescribir; el gateway del destino (gw-hostnet) acepta el hostname
# interno porque su listener tampoco declara hostname.
#
# PUERTO 80, NO 443 — TEMPORAL. El 443 resetea en el handshake TLS (bloqueo
# §7.2 confirmado en vivo, ver 02-serviceentry-destino.yaml). Sin TLS
# origination no hay SNI que fijar; apuntando directo al 80 en plano se puede
# validar wristband + AuthPolicy + claims igual, porque viajan en el header
# x-egress-token, no dependen de la capa TLS. Volver a 443 cuando se resuelva
# el §7.2 (y ahí sí aplicar 04-destinationrule-tls.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: egress-backend
  namespace: poc-ingress-kuadrant
spec:
  parentRefs:
    - name: egress-gw
      sectionName: mesh-internal
  hostnames:
    - "backend"
    - "backend.poc-ingress-kuadrant"
    - "backend.poc-ingress-kuadrant.svc"
    - "backend.poc-ingress-kuadrant.svc.cluster.local"
  rules:
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # backendRef a un host externo: extensión de Istio para Gateway API.
        - group: networking.istio.io
          kind: Hostname
          name: "bff.paas-demo.bancogalicia.com.ar"
          port: 80
---
# Verificación:
#   kubectl -n poc-ingress-kuadrant get httproute egress-backend \
#     -o jsonpath='{.status.parents[*].conditions[?(@.type=="Accepted")].message}{"\n"}'
#
# Si el controller rechaza `kind: Hostname` como backendRef (no debería en
# Istio upstream reciente, pero confirmarlo — es distinto del istiod gestionado
# de OCP donde sí está probado), el fallback es un Service ExternalName hacia
# el FQDN del destino.
