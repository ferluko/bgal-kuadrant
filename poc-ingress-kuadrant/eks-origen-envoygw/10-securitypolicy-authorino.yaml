# Cluster ORIGEN (EKS) — reemplaza al AuthPolicy de Kuadrant (05-authpolicy-wristband.yaml)
# cuando el provider es Envoy Gateway.
#
# PROBADO EN VIVO (2026-08-26, Ronda 4) — tráfico real autorizado de punta a punta, confirmado
# con logs de Authorino (`authorized: true`). Ver README.md, sección "LA SOLUCIÓN".
#
# POR QUÉ ESTO Y NO EL AuthPolicy DE KUADRANT: el AuthPolicy hace que Kuadrant intente enganchar
# su propio plugin Wasm (`kuadrant-wasm-shim`) al Gateway — y ese plugin no carga en el runtime
# WASM de Envoy Gateway v1.2.0 (incompatibilidad binaria confirmada, ver README). Mientras exista
# un AuthPolicy apuntando a una ruta de este Gateway, Kuadrant reintenta enganchar el plugin roto
# una y otra vez, y el listener entero rechaza CUALQUIER actualización de config mientras el
# plugin no cargue — no solo la del AuthPolicy.
#
# Este SecurityPolicy usa el ext_authz NATIVO de Envoy (sin plugin Wasm de por medio), apuntando
# directo al servicio gRPC de Authorino — el mismo Authorino, el mismo AuthConfig-como-motor de
# autorización, solo que sin la capa de Kuadrant/wasm-shim en el medio.
#
# PRECONDICIÓN: el AuthPolicy de Kuadrant para esta ruta tiene que estar BORRADO, no solo
# reemplazado — si sigue existiendo, Kuadrant va a seguir peleando por el mismo listener:
#   kubectl -n poc-ingress-kuadrant delete authpolicy egress-backend-jwt
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: egress-backend-authorino
  namespace: poc-ingress-kuadrant
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: egress-backend
  extAuth:
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: authorino-authorino-authorization
          namespace: kuadrant-system
          port: 50051
---
# Referencia cross-namespace (poc-ingress-kuadrant -> kuadrant-system) — regla estándar de
# seguridad de Gateway API, no algo específico de este caso.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-securitypolicy-to-authorino
  namespace: kuadrant-system
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: poc-ingress-kuadrant
  to:
    - group: ""
      kind: Service
      name: authorino-authorino-authorization
---
# Verificación:
#   kubectl -n poc-ingress-kuadrant get securitypolicy egress-backend-authorino \
#     -o jsonpath='{.status.ancestors[0].conditions[0]}{"\n"}'
#   -> {"type":"Accepted","status":"True","reason":"Accepted","message":"Policy has been accepted."}
