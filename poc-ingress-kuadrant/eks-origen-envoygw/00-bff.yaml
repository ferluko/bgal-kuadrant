# Cluster ORIGEN (EKS) — HOP 1, el BFF que efectivamente encadena.
#
# Copia de echoserver-cascada/02-bff.yaml, adaptada: namespace
# poc-ingress-kuadrant y UPSTREAM_URL apuntando a NUESTRO backend (el que el
# cutover de 09-cutover-service-selector.yaml intercepta). El BFF no se
# entera del cutover: sigue pegándole al mismo FQDN antes y después.
#
# Requiere 00-configmap-bff.yaml aplicado antes (mismo código Python, sin
# cambios — no tiene nada hardcodeado del namespace, todo sale de env vars).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: poc-ingress-kuadrant
  labels:
    app: bff
    poc.galicia.io/rol: cascada-hop1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
        poc.galicia.io/rol: cascada-hop1
    spec:
      containers:
        - name: bff
          image: registry.access.redhat.com/ubi9/python-312:1
          command: ["python3", "/opt/cascade/bff.py"]
          env:
            - name: PORT
              value: "8080"
            - name: HOP_NAME
              value: bff
            # La URL que el cutover intercepta cambiándole el selector al
            # Service backend (09). El BFF no se entera: mismo FQDN siempre.
            - name: UPSTREAM_URL
              value: http://backend.poc-ingress-kuadrant.svc.cluster.local:8080
            - name: UPSTREAM_TIMEOUT_MS
              value: "5000"
            - name: MIRROR_UPSTREAM_STATUS
              value: "false"
            - name: ENABLE_ENVIRONMENT
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: bff
              mountPath: /opt/cascade
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: bff
          configMap:
            name: cascade-bff
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: poc-ingress-kuadrant
  labels:
    app: bff
spec:
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: server-port
      port: 8080
      targetPort: 8080
      protocol: TCP
