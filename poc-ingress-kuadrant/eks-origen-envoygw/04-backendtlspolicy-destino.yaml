# Cluster ORIGEN (EKS) — TLS origination en el gateway de egreso, SIN
# DestinationRule. SIN APLICAR todavía en el original tampoco (443 diferido
# por el bloqueo §7.2 de SDS en OCP — ver 02-service-endpointslice-destino.yaml)
# — se deja escrito acá por la misma razón que el original: listo para cuando
# se resuelva.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: backend-destino-tls
  namespace: poc-ingress-kuadrant
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: backend-destino
  validation:
    hostname: "bff-eks.paas-demo.bancogalicia.com.ar"
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: destino-ca-bundle
---
# ConfigMap derivado del Secret `destino-ca` existente (mismo comando que en
# poc-egress-kuadrant/origen-envoygw/04, adaptado al namespace):
#
#   kubectl -n poc-ingress-kuadrant get secret destino-ca -o jsonpath='{.data.ca\.crt}' \
#     | base64 -d \
#     | kubectl -n poc-ingress-kuadrant create configmap destino-ca-bundle --from-file=ca.crt=/dev/stdin
---
# EL GAP REAL, otra vez: BackendTLSPolicy no cubre connectionPool. Acá el
# número (idleTimeout) ya estaba marcado como "VERIFICAR" en el original — no
# se copia 300s como si fuera un valor confirmado para F5/OCP, va comentado.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: backend-destino-pool
  namespace: poc-ingress-kuadrant
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: backend-destino
  circuitBreaker:
    maxConnections: 64
  timeout:
    tcp:
      connectTimeout: 5s
    http:
      # <<< SIN CONFIRMAR, igual que en el original (línea 34 de
      # eks-origen/04-destinationrule-tls.yaml): el idle timeout real del
      # F5/pool de OCP no está verificado. No copiar 300s a ciegas — ese
      # número viene del NLB de AWS del otro sentido, no de este destino.
      connectionIdleTimeout: 300s
---
# SIN CONFIRMAR — mismos tres puntos que
# poc-egress-kuadrant/origen-envoygw/04-backendtlspolicy-destino.yaml:
#   1. Nombres exactos de campos de BackendTrafficPolicy contra la versión de
#      Envoy Gateway instalada (no disponible en esta sesión).
#   2. maxRequestsPerConnection: 0 y h2UpgradePolicy del original sin mapeo
#      encontrado.
#   3. Repetir la medición de RTT real EKS->OCP antes de confiar en estos
#      valores — acá ni siquiera hay una medición previa que copiar (a
#      diferencia del sentido OCP->EKS), es la primera vez que se necesitaría.
