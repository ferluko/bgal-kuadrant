# Cluster ORIGEN (EKS) — EL CUTOVER DE LA INTERCEPCIÓN. Aplicar ÚLTIMO.
#
# ⚠️ PROBADO EN VIVO CONTRA EL CUTOVER REAL (2026-08-26) Y ROTO — ver el
# workaround al final del archivo antes de usar esto con Envoy Gateway.
#
# Mismo patrón que poc-egress-kuadrant/origen/09, roles invertidos. El Service
# `backend` NO se recrea: se le cambia el `selector` in-place para que sus
# endpoints pasen a ser los pods del gateway de egreso en lugar de los pods de
# la app. La ClusterIP no cambia, el nombre DNS no cambia, el puerto no
# cambia. El Deployment `backend` NO se toca: sigue corriendo y sirviendo a
# través del Service `backend-local` (06).
#
# Para el cliente `bff` no cambió nada: misma URL, misma IP, mismo puerto.
#
# EL PROBLEMA CON ENVOY GATEWAY (encontrado probando el cutover real, no en
# teoría): este archivo depende de que el pod del gateway viva en EL MISMO
# namespace que el Service `backend` — un Service de Kubernetes solo puede
# seleccionar pods de su propio namespace, es una regla dura del API, no un
# bug puntual. Con Istio, el pod de `egress-gw` se crea en
# `poc-ingress-kuadrant` (mismo ns que el Gateway) — el selector funciona.
# Con Envoy Gateway, el pod se crea en `envoy-gateway-system` (el namespace
# del CONTROLLER, no el de la app) — el selector deja de encontrar nada, y
# `backend:8080` empieza a devolver Connection refused. Se confirmó en vivo:
# cortó el cutover real por el tiempo que tardó en revertirse.
#
# PRECONDICIONES:
#   1. Cadena de egreso probada a mano end-to-end (equivalente al README §7.1
#      de poc-egress-kuadrant, con los roles invertidos).
#   2. 06-service-backend-local.yaml aplicado y con los mismos endpoints que
#      backend.
#   3. Confirmar que los pods del gateway (egress-gw) llevan la label
#      gateway.networking.k8s.io/gateway-name — comprobado que Istio upstream
#      la pone de fábrica (no es la variante gestionada de OCP), pero
#      verificarlo antes de dar el patch por bueno:
#      kubectl -n poc-ingress-kuadrant get pods -l gateway.networking.k8s.io/gateway-name=egress-gw
#
# FORMA RECOMENDADA DE APLICARLO — patch de un campo, con backup:
#
#   kubectl -n poc-ingress-kuadrant get svc backend -o yaml > /tmp/backend-svc.bak.yaml
#   kubectl -n poc-ingress-kuadrant patch svc backend --type merge -p \
#     '{"spec":{"selector":{"gateway.networking.k8s.io/gateway-name":"egress-gw"}}}'
#
# ROLLBACK — un patch, ~1 segundo, los pods reales nunca se detuvieron:
#
#   kubectl -n poc-ingress-kuadrant patch svc backend --type merge -p \
#     '{"spec":{"selector":{"app":"backend"}}}'
#
# ---------------------------------------------------------------------------
# Representación declarativa del estado final del Service, para GitOps.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: poc-ingress-kuadrant
  annotations:
    poc.galicia.io/intercepcion: "egress-gw"
    poc.galicia.io/rollback: 'kubectl -n poc-ingress-kuadrant patch svc backend --type merge -p ''{"spec":{"selector":{"app":"backend"}}}'''
spec:
  type: ClusterIP
  # ÚNICO cambio funcional respecto del Service original.
  selector:
    gateway.networking.k8s.io/gateway-name: egress-gw
  ports:
    - name: server-port
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Verificación inmediata:
#   kubectl -n poc-ingress-kuadrant get svc backend -o jsonpath='{.spec.clusterIP}{"\n"}'
#   kubectl -n poc-ingress-kuadrant get endpointslice -l kubernetes.io/service-name=backend \
#     -o jsonpath='{.items[*].endpoints[*].targetRef.name}{"\n"}'
#   kubectl -n poc-ingress-kuadrant exec deploy/bff -- \
#     curl -s -o /dev/null -w '%{http_code}\n' http://backend.poc-ingress-kuadrant.svc.cluster.local:8080/

################################################################################
# WORKAROUND — SOLO SI EL PROVIDER ES ENVOY GATEWAY, reemplaza al Service de
# arriba. PROBADO EN VIVO (2026-08-26, Ronda 2) Y FUNCIONA para esta parte
# puntual: el DNS resolvió al ClusterIP correcto, y una prueba directa por esa
# IP (sin pasar por el HTTPRoute) devolvió 404 de Envoy — confirma
# conectividad real cruzando namespaces. El tráfico de punta a punta igual
# falló, pero por otros dos motivos sin relación al namespace (mezcla de
# tipos de backend, y Kuadrant/Authorino sin enganchar al proxy nuevo) — ver
# poc-ingress-kuadrant/eks-origen-envoygw/README.md, Problemas 3 y 4.
################################################################################
#
# En vez de un selector por label (que no cruza namespaces), un Service tipo
# ExternalName: no selecciona pods, es un alias de DNS que SÍ puede apuntar a
# un Service en otro namespace — es resolución DNS, no descubrimiento de
# endpoints, así que la regla de "mismo namespace" no aplica acá.
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: backend
#   namespace: poc-ingress-kuadrant
#   annotations:
#     poc.galicia.io/intercepcion: "egress-gw (envoy gateway, ExternalName)"
# spec:
#   type: ExternalName
#   # <<< Nombre AUTOGENERADO por Envoy Gateway al crear el Gateway — confirmar
#   # el nombre real después de aplicar 01-gateway-egress.yaml:
#   #   kubectl -n envoy-gateway-system get svc \
#   #     -l gateway.networking.k8s.io/gateway-name=egress-gw -o name
#   externalName: envoy-poc-ingress-kuadrant-egress-gw-<hash>.envoy-gateway-system.svc.cluster.local
#   ports:
#     - port: 8080
#
# EL PROBLEMA DE ESTE WORKAROUND: <hash> lo genera el controller, no es
# estable garantizado — si el Gateway se recrea (no solo se actualiza), el
# hash puede cambiar y el ExternalName queda apuntando a un nombre que ya no
# existe, rompiendo el cutover en silencio (DNS que no resuelve, no un error
# visible al aplicar). Mitigación a explorar, sin confirmar: fijar el nombre
# del Service vía el recurso EnvoyProxy (el mismo que fuerza ClusterIP en
# 01-gateway-egress.yaml) — no se confirmó que exponga ese campo.
#
# Dato de la prueba en vivo: el <hash> (db477625) se mantuvo IDÉNTICO entre la
# Ronda 1 y la Ronda 2, en las que solo se cambió gatewayClassName in-place
# sin borrar el objeto Gateway. No prueba estabilidad ante un borrado/recreación
# real — sigue sin confirmar ese caso.
#
# ROLLBACK — igual que arriba, volver el selector a `app: backend` (el
# ExternalName no vuelve solo, hay que reaplicar el Service original):
#   kubectl -n poc-ingress-kuadrant patch svc backend --type merge -p \
#     '{"spec":{"type":"ClusterIP","selector":{"app":"backend"},"externalName":null}}'
