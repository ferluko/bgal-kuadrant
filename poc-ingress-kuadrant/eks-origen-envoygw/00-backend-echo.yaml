# Cluster ORIGEN (EKS) — HOP 2 local, el backend "actual" que bff llama
# ANTES del cutover. Copia de echoserver-cascada/03-backend-echo.yaml,
# adaptada: namespace poc-ingress-kuadrant y runAsNonRoot en false.
#
# runAsNonRoot:true en el original rompe acá — ealen/echo-server:0.9.2 corre
# como root por defecto y en EKS (a diferencia del SCC restricted-v2 de OCP,
# que asigna un UID arbitrario no-root sin que la imagen lo pida) eso da
# CreateContainerConfigError. Ya verificado empíricamente varias veces en
# este cluster (ver destino-eks.yaml y ocp-destino/00-backend-echo.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: poc-ingress-kuadrant
  labels:
    app: backend
    poc.galicia.io/rol: cascada-hop2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        poc.galicia.io/rol: cascada-hop2
    spec:
      containers:
        - name: echo-server
          image: ealen/echo-server:0.9.2
          env:
            - name: PORT
              value: "8080"
            - name: LOGS__IGNORE__PING
              value: "true"
            # Igual que del otro lado: único dato que identifica al pod real
            # que atendió (ver README de echoserver-cascada §6).
            - name: ENABLE__ENVIRONMENT
              value: "true"
            - name: ENABLE__FILE
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: poc-ingress-kuadrant
  labels:
    app: backend
spec:
  type: ClusterIP
  # OJO: el cutover (09-cutover-service-selector.yaml) le cambia este
  # selector para apuntar a los pods de egress-gw. Ese es el punto de corte.
  selector:
    app: backend
  ports:
    - name: server-port
      port: 8080
      targetPort: 8080
      protocol: TCP
