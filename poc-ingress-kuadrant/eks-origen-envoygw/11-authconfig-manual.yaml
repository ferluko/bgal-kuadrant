# Cluster ORIGEN (EKS) — AuthConfig manual para Authorino, sin pasar por el AuthPolicy de
# Kuadrant. Complemento de 10-securitypolicy-authorino.yaml.
#
# PROBADO EN VIVO (2026-08-26, Ronda 4) — Ready: true, 4/4 hosts, wristband firmado y validado
# contra tráfico real.
#
# POR QUÉ HACE FALTA UNO NUEVO, no alcanza con el que ya genera el AuthPolicy: el AuthConfig que
# arma Kuadrant a partir de un AuthPolicy usa un HOST SINTÉTICO como clave de spec.hosts (un
# hash, ej. "cfb5fab78fad..."), no el hostname real — porque el wasm-shim de Kuadrant resuelve la
# ruta/regla por su cuenta y le pasa ese contexto a Authorino como parte del CheckRequest. El
# ext_authz NATIVO de Envoy (SecurityPolicy, sin wasm-shim) en cambio le manda a Authorino el
# `:authority` REAL de la request tal cual llega — así que Authorino necesita un AuthConfig cuyo
# spec.hosts tenga el hostname real, no el hash.
#
# El spec de abajo es una copia exacta (mismo wristband, mismos claims, misma clave de firma) del
# AuthConfig que generaba Kuadrant para esta misma ruta — solo cambia spec.hosts.
apiVersion: authorino.kuadrant.io/v1beta3
kind: AuthConfig
metadata:
  name: egress-backend-manual
  namespace: kuadrant-system
spec:
  hosts:
    - "backend"
    - "backend.poc-ingress-kuadrant"
    - "backend.poc-ingress-kuadrant.svc"
    - "backend.poc-ingress-kuadrant.svc.cluster.local"
  authentication:
    workload-interno:
      anonymous: {}
  response:
    success:
      headers:
        x-egress-token:
          wristband:
            issuer: "https://egress.devops-cilium-1-35.bancogalicia.com.ar"
            signingKeyRefs:
              - name: egress-eks-1
                algorithm: RS256
            tokenDuration: 300
            customClaims:
              src_cluster:
                value: "devops-cilium-1-35"
              src_namespace:
                value: "poc-ingress-kuadrant"
              src_service:
                value: "bff"
              dst_service:
                value: "backend"
              aud:
                value: "bff-eks.paas-demo.bancogalicia.com.ar"
---
# Verificación:
#   kubectl -n kuadrant-system get authconfig egress-backend-manual \
#     -o jsonpath='{.status.summary}{"\n"}'
#   -> ready: true, numHostsReady: "4/4", festivalWristbandEnabled: true
#
# COSTO DE ESTE CAMINO: este AuthConfig NO está gestionado por el AuthPolicy de Kuadrant — hay
# que mantenerlo a mano (o con tooling propio, Terraform/GitOps) si el wristband cambia (nueva
# clave de firma, nuevos claims, etc.). Se pierde la capa de abstracción de Kuadrant para esta
# ruta puntual, a cambio de que el tráfico real funcione mientras el bug del wasm-shim siga sin
# resolver.
