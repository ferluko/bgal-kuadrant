# Cluster ORIGEN (EKS, devops-cilium-1-35) — Gateway de egreso dedicado.
#
# DIFERENCIA con eks-origen/01: gatewayClassName apunta a Envoy Gateway, no a
# Istio upstream. Este SÍ es el mismo Istio (1.30.2) contra el que se probó en
# vivo el hallazgo de EndpointSlice(FQDN) — a diferencia del borrador del lado
# OCP (poc-egress-kuadrant/origen-envoygw), acá la evidencia empírica aplica
# directo, no por transferencia entre versiones parecidas.
#
# Prerrequisito NO incluido acá — instalar el controller una sola vez en el
# cluster (no se instaló en esta sesión; se dejó en modo borrador a pedido
# explícito, sin tocar cilium-1-35):
#   helm install eg oci://docker.io/envoyproxy/gateway-helm \
#     --version v1.2.0 -n envoy-gateway-system --create-namespace
#
# El resto de las razones de diseño (Service ClusterIP, label de Kuadrant,
# mismo namespace que la app) no cambia — ver eks-origen/01-gateway-egress.yaml.
# La annotation `networking.istio.io/service-type: ClusterIP` desaparece: es
# Istio-specific, Envoy Gateway la ignoraría (ver el mecanismo equivalente,
# el recurso `EnvoyProxy`, en el comentario de
# poc-egress-kuadrant/origen-envoygw/01-gateway-egress.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egress-gw
  namespace: poc-ingress-kuadrant
  labels:
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: mesh-internal
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
# Verificación — mismos comandos que eks-origen/01-gateway-egress.yaml:
#   kubectl -n poc-ingress-kuadrant get gateway egress-gw \
#     -o jsonpath='{.status.conditions[?(@.type=="Programmed")].message}{"\n"}'
#   kubectl -n poc-ingress-kuadrant get svc  -l gateway.networking.k8s.io/gateway-name=egress-gw -o yaml
