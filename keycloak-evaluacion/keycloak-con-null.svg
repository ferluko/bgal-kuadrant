<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 960" width="1680" height="960" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5A6B7B"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1C7293"/></marker>
<marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#02C39A"/></marker>
</defs>
<rect x="0" y="0" width="1680" height="960" fill="#FFFFFF"/>
<text x="840" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#21295C">Keycloak como IdP — CON Null como portal/orquestador</text>
<text x="840" y="55" text-anchor="middle" font-size="12.5" fill="#5A6B7B" font-style="italic">El unico paso humano es que el consumidor pida la suscripcion. Null correlaciona la credencial con los manifiestos K8s.</text>

<!-- SECCION A: provisioning via Null -->
<rect x="40" y="85" width="1600" height="260" rx="14" fill="none" stroke="#02C39A" stroke-width="2" stroke-dasharray="7,5"/>
<rect x="58" y="72" width="330" height="24" fill="#FFFFFF"/>
<text x="70" y="89" font-size="14" font-weight="bold" fill="#02C39A">PROVISIONING — SELF-SERVICE (Null)</text>

<rect x="80" y="150" width="220" height="60" rx="10" fill="#D98324"/>
<text x="190" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#241300">Consumidor</text>

<line x1="300" y1="180" x2="380" y2="180" stroke="#D98324" stroke-width="2" marker-end="url(#arrowTeal)"/>
<circle cx="340" cy="164" r="13" fill="#D98324"/>
<text x="340" y="169" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">1</text>
<text x="340" y="145" text-anchor="middle" font-size="10.5" fill="#5A6B7B" font-style="italic">solicita suscripcion</text>

<rect x="380" y="140" width="360" height="90" rx="10" fill="#2E3872"/>
<text x="560" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Null</text>
<text x="560" y="192" text-anchor="middle" font-size="11.5" fill="#CFE3EE">portal self-service + orquestacion</text>
<text x="560" y="210" text-anchor="middle" font-size="10.5" fill="#CFE3EE">un solo lugar donde se decide la suscripcion</text>

<line x1="480" y1="230" x2="380" y2="290" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<circle cx="420" cy="265" r="13" fill="#1C7293"/>
<text x="420" y="270" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">2a</text>

<rect x="200" y="290" width="360" height="70" rx="10" fill="#02C39A"/>
<text x="380" y="318" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#04241C">Keycloak Admin REST API</text>
<text x="380" y="336" text-anchor="middle" font-size="11" fill="#04241C">POST /admin/realms/&lt;realm&gt;/clients</text>
<text x="380" y="352" text-anchor="middle" font-size="10" fill="#04241C" font-style="italic">crea Client (client_id + secret)</text>

<line x1="640" y1="230" x2="760" y2="290" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<circle cx="710" cy="265" r="13" fill="#1C7293"/>
<text x="710" y="270" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">2b</text>

<rect x="600" y="290" width="400" height="70" rx="10" fill="#065A82"/>
<text x="800" y="318" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">K8s API / GitOps pipeline</text>
<text x="800" y="336" text-anchor="middle" font-size="11" fill="#CFE3EE">aplica HTTPRoute + AuthPolicy + RateLimitPolicy</text>
<text x="800" y="352" text-anchor="middle" font-size="10" fill="#CFE3EE" font-style="italic">apuntando a issuerUrl + claim azp == client_id nuevo</text>

<line x1="740" y1="185" x2="1080" y2="185" stroke="#02C39A" stroke-width="2" marker-end="url(#arrowMint)"/>
<circle cx="910" cy="169" r="13" fill="#02C39A"/>
<text x="910" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#04241C">3</text>
<text x="910" y="150" text-anchor="middle" font-size="10.5" fill="#5A6B7B" font-style="italic">entrega client_id/secret (o los deja en un secret manager)</text>

<rect x="1080" y="150" width="260" height="60" rx="10" fill="#D98324"/>
<text x="1210" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#241300">Consumidor (con credenciales)</text>

<rect x="1080" y="250" width="480" height="80" rx="10" fill="#F2F6F9" stroke="#D6E0E8" stroke-width="1.5"/>
<text x="1320" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#21295C">Diferencia clave vs. sin Null</text>
<text x="1320" y="292" text-anchor="middle" font-size="11" fill="#21295C">2a y 2b se disparan desde el MISMO evento (la suscripcion),</text>
<text x="1320" y="310" text-anchor="middle" font-size="11" fill="#21295C">no dos pasos manuales que alguien puede desincronizar.</text>

<!-- SECCION B: runtime (identico al esquema sin Null) -->
<rect x="40" y="365" width="1600" height="555" rx="14" fill="none" stroke="#1C7293" stroke-width="2" stroke-dasharray="7,5"/>
<rect x="58" y="352" width="230" height="24" fill="#FFFFFF"/>
<text x="70" y="369" font-size="14" font-weight="bold" fill="#1C7293">RUNTIME — IGUAL EN AMBOS ESQUEMAS</text>

<rect x="90" y="420" width="280" height="70" rx="10" fill="#065A82"/>
<text x="230" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Consumer app (bff)</text>

<line x1="370" y1="440" x2="520" y2="440" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<text x="445" y="428" text-anchor="middle" font-size="11" fill="#1C7293" font-style="italic">4) client_credentials</text>
<circle cx="445" cy="455" r="13" fill="#2E3872"/>
<text x="445" y="460" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">4</text>

<rect x="520" y="405" width="380" height="70" rx="10" fill="#02C39A"/>
<text x="710" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#04241C">Keycloak</text>
<text x="710" y="453" text-anchor="middle" font-size="11.5" fill="#04241C">/realms/&lt;realm&gt;/protocol/openid-connect/token</text>

<line x1="520" y1="475" x2="370" y2="475" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<text x="445" y="492" text-anchor="middle" font-size="11" fill="#1C7293" font-style="italic">devuelve JWT firmado</text>

<line x1="230" y1="490" x2="230" y2="550" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<text x="250" y="525" text-anchor="start" font-size="11" fill="#1C7293" font-style="italic">5) request + Bearer JWT</text>
<circle cx="230" cy="520" r="13" fill="#2E3872"/>
<text x="230" y="525" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">5</text>

<rect x="90" y="550" width="280" height="80" rx="10" fill="#065A82"/>
<text x="230" y="584" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Gateway</text>
<text x="230" y="602" text-anchor="middle" font-size="11.5" fill="#CFE3EE">egress-gw / ingress-gw</text>
<text x="230" y="618" text-anchor="middle" font-size="10.5" fill="#CFE3EE">AuthPolicy de Kuadrant (creada en 2b)</text>

<line x1="370" y1="580" x2="520" y2="510" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<circle cx="480" cy="535" r="13" fill="#2E3872"/>
<text x="480" y="540" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">6</text>

<rect x="520" y="510" width="440" height="110" rx="10" fill="#2E3872"/>
<text x="740" y="538" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">Keycloak — /.well-known/openid-configuration</text>
<text x="740" y="556" text-anchor="middle" font-size="12" fill="#FFFFFF">+ jwks_uri (descubrimiento OIDC estandar)</text>
<text x="740" y="574" text-anchor="middle" font-size="11.5" fill="#CFE3EE">Authorino valida firma + claims (azp == client_id de 2a)</text>
<text x="740" y="592" text-anchor="middle" font-size="10.5" fill="#CFE3EE" font-style="italic">azp esta atado criptograficamente a la credencial real</text>

<line x1="230" y1="630" x2="230" y2="690" stroke="#1C7293" stroke-width="2" marker-end="url(#arrowTeal)"/>
<circle cx="230" cy="660" r="13" fill="#2E3872"/>
<text x="230" y="665" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">7</text>
<text x="250" y="665" text-anchor="start" font-size="11" fill="#1C7293" font-style="italic">forward si valido</text>

<rect x="90" y="690" width="280" height="70" rx="10" fill="#02C39A"/>
<text x="230" y="730" text-anchor="middle" font-size="15" font-weight="bold" fill="#04241C">Backend</text>

<!-- Leyenda -->
<line x1="40" y1="870" x2="1640" y2="870" stroke="#D6E0E8" stroke-width="1.5"/>
<circle cx="55" cy="895" r="9" fill="#D98324"/>
<text x="75" y="899" font-size="12.5" fill="#21295C">Accion del consumidor (self-service, no toil de plataforma)</text>
<circle cx="480" cy="895" r="9" fill="#2E3872"/>
<text x="500" y="899" font-size="12.5" fill="#21295C">Null (orquesta)</text>
<circle cx="660" cy="895" r="9" fill="#02C39A"/>
<text x="680" y="899" font-size="12.5" fill="#21295C">Keycloak (identidad)</text>
<circle cx="860" cy="895" r="9" fill="#065A82"/>
<text x="880" y="899" font-size="12.5" fill="#21295C">Kubernetes / Gateway</text>

<text x="840" y="930" text-anchor="middle" font-size="11" fill="#5A6B7B" font-style="italic">Nota: si Null no soporta llamar APIs externas + aplicar manifiestos K8s de forma nativa, 2a/2b se resuelven con un servicio intermedio chico que Null dispara — sin confirmar todavia.</text>
</svg>
