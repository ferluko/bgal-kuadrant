# Credencial válida para el consumer del PoC. Vive en kuadrant-system porque
# ahí es donde Authorino resuelve el selector del apiKey (mismo límite que el
# Secret de firma del wristband, confirmado que allNamespaces no cambia esto
# en esta instancia namespaced).
apiVersion: v1
kind: Secret
metadata:
  name: meshtest-consumer-key
  namespace: kuadrant-system
  labels:
    authorino.kuadrant.io/managed-by: authorino
    app: meshtest
