# DESTINO arqlab — valida el JWT-SVID que mintea paas-lab.
#
# CAMBIO CLAVE respecto de las policies existentes: el `sub` se compara contra una LISTA con
# `in`, no contra un único valor con `==`. Las dos policies de hoy (arqlab y EKS) pinean un
# solo sub, y por eso ningún destino acepta a paas-lab. Con la lista se admite el tercer
# cluster sin romper a los otros dos, y se agrega el cuarto cambiando una línea.
#
# El `sub` de paas-lab está CONFIRMADO EN VIVO (preflight 2026-09-09, mint real):
#   spiffe://poc-egress.bancogalicia.com.ar/paas-lab/egress-gw
#
# ANTES DE DAR POR BUENO UN 200 DE ESTA POLICY: leer 14-diagnostico-claims.md. Está
# confirmado en vivo que el bloque claims-esperados del destino OCP NO estaba rechazando
# nada (pasó un sub "impostor"). Mientras esa causa no esté cerrada, un PASS acá no prueba
# que la autorización funcione — solo que el tráfico llega.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: backend-lab-vault-spiffe
  namespace: poc-ingress-kuadrant
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: backend-lab
  rules:
    authentication:
      "egress-vault-spiffe":
        jwt:
          jwksUrl: https://vault-cluster-noprod-private-vault-16d614b5.bc6ede80.z1.hashicorp.cloud:8200/v1/admin/spiffe/spiffe/.well-known/keys
          ttl: 300
        credentials:
          customHeader:
            name: x-egress-token
        # SIN `prefix`. Doble motivo: (a) confirmado en vivo que Authorino no saca el
        # "Bearer " al parsear, y (b) el CRD de paas-lab directamente no tiene ese campo
        # (dialecto upstream) — un campo que el CRD no declara se PODA EN SILENCIO al
        # aplicar. Ver 14-diagnostico-claims.md: es la misma mecánica que sospechamos
        # detrás del hallazgo de las claims.

    authorization:
      "claims-esperados":
        patternMatching:
          patterns:
            - predicate: |
                auth.identity.iss == "https://vault-cluster-noprod-private-vault-16d614b5.bc6ede80.z1.hashicorp.cloud:8200"
            - predicate: |
                "app3.paas-demo.bancogalicia.com.ar" in auth.identity.aud
            - predicate: |
                auth.identity.sub in [
                  "spiffe://poc-egress.bancogalicia.com.ar/paas-lab/egress-gw"
                ]

    response:
      unauthenticated:
        message:
          value: "falta o es invalido el token de egreso (x-egress-token)"
      unauthorized:
        message:
          value: "el token de egreso no corresponde a un consumidor habilitado de backend"
      success:
        headers: {}
---
# PRIMER COMANDO DESPUÉS DE APLICAR — no es opcional, es el que detecta el poda-silenciosa:
#
#   oc --context=<arqlab> -n poc-ingress-kuadrant get authpolicy backend-lab-vault-spiffe \
#     -o jsonpath='{.spec.rules.authorization.claims-esperados.patternMatching.patterns}{"\n"}'
#
# Si eso vuelve VACÍO o sin los `predicate`, el API server podó el campo porque el CRD
# instalado no lo declara: la policy queda Accepted+Enforced y no evalúa nada.
