# DESTINO arqlab — Gateway de ingreso para esta PoC.
#
# DECISIÓN DE DISEÑO: se usa gatewayClassName openshift-default + Route passthrough, NO el
# gw-hostnet de connlink-ingress que ya existe. Tres razones:
#
#   1. gw-hostnet hoy solo tiene listener HTTP:80. El 443 está BLOQUEADO por el problema de
#      SDS del runbook §7.2 (Envoy pide el cert, istiod responde "cross namespace secret
#      reference requires ReferenceGrant" aunque Gateway y Secret están en el mismo ns).
#      Sin TLS en el destino, el DestinationRule del origen no puede originar TLS.
#   2. Este camino evita el bloqueo por completo: con openshift-default el deployment lo crea
#      el controller de Istio, que es justamente la diferencia que el runbook sospecha
#      (istiod no asocia las VerifiedCertificateReferences a un proxy que no desplegó él).
#   3. BONUS: esto ES el "experimento de control" que el runbook §7.2 lista como pendiente
#      #2. Si acá el cert SÍ llega por SDS, queda probado que el problema es el camino de
#      despliegue manual del DaemonSet hostNetwork -> caso de soporte con Red Hat acotado.
#      Si tampoco llega, es un hallazgo de plataforma que afecta también a openshift-default.
#      En cualquiera de los dos casos cerramos una incógnita abierta, sin trabajo extra.
#
# Con passthrough no hace falta MetalLB: el Gateway va ClusterIP y lo publica el router.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress-gw-lab
  namespace: poc-ingress-kuadrant
  labels:
    kuadrant.io/gateway: "true"
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: paas-demo-wildcard-tls
      # SIN `hostname` a propósito. Con un cert multi-SAN, fijarlo es la forma más rápida de
      # romperlo: "*.shard1.paas-demo..." NO matchea "shard1.paas-demo..." (el wildcard cubre
      # subdominios, no el dominio), y sin filter chain que matchee el SNI Envoy resetea la
      # conexión con un error que no señala a la causa. Verificar los SAN antes de tocarlo:
      #   openssl x509 -in <cert>.crt -noout -subject -ext subjectAltName -dates
      allowedRoutes:
        namespaces:
          from: Same
---
# El Secret paas-demo-wildcard-tls tiene que estar en ESTE namespace y ser kubernetes.io/tls,
# con la CADENA COMPLETA en tls.crt (hoja + intermedias). Con solo la hoja, el origen no puede
# armar la cadena y el handshake falla con un 503 genérico que no dice nada:
#   oc --context=<arqlab> -n poc-ingress-kuadrant get secret paas-demo-wildcard-tls \
#     -o jsonpath='{.data.tls\.crt}' | base64 -d | grep -c 'BEGIN CERTIFICATE'   # tiene que dar >1
