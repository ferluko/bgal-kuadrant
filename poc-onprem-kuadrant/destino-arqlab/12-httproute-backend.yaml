# DESTINO arqlab — la route que recibe el tráfico de paas-lab.
#
# El hostname es el FQDN INTERNO del origen, no app3: el Host header nunca se reescribe,
# así que lo que llega es literalmente backend.poc-egress-kuadrant.svc.cluster.local.
# app3 solo vive en el SNI, y eso ya lo resolvió la Route passthrough (11).
#
# OJO con el puerto en el Host: el origen manda ":8080" pegado al hostname. Gateway API
# matchea el hostname SIN puerto, así que el valor de abajo es correcto — pero si ves 404
# del Gateway (no del router), es el primer lugar donde mirar.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-lab
  namespace: poc-ingress-kuadrant
spec:
  parentRefs:
    - name: ingress-gw-lab
      sectionName: https
  hostnames:
    - "backend.poc-egress-kuadrant.svc.cluster.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8080
---
# Verificar que el Gateway la adoptó DE VERDAD (no alcanza con que exista):
#   oc --context=<arqlab> -n poc-ingress-kuadrant get httproute backend-lab \
#     -o jsonpath='{range .status.parents[*]}{range .conditions[*]}{.type}={.status} {end}{end}{"\n"}'
#
# Si el status trae SOLO condiciones kuadrant.io/*, el controller de Gateway API nunca procesó
# la route: el problema está en el Gateway (típicamente el listener sin certificado), no en la
# policy. Es el chequeo que decide en un comando de qué lado está el problema.
