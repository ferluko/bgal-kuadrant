# ORIGEN paas-lab — el ingreso de arqlab como servicio externo a la malla.
#
# DNS (Infoblox). Medido 2026-09-09: son DOS VIPs distintas.
#   shard1.paas-demo         →  10.254.124.36   F5 de gw-hostnet. TLS RST. NO tocar.
#   *.apps.paas-arqlab       →  10.254.28.1     IngressController default (HostNetwork).
# app3 tiene que resolver a 10.254.28.1 (A, o CNAME al mismo target que *.apps).
# NO CNAME a shard1: la Route passthrough vive en el router default, no en ese F5.
#
# VERIFICAR ANTES DE APLICAR: paas-lab ya tiene un ServiceEntry `backend-destino` heredado de
# arqlab, casi seguro apuntando a app2 (que resuelve al NLB de EKS). Mirar qué host tiene:
#   oc --context=paas-lab -n poc-egress-kuadrant get serviceentry backend-destino \
#     -o jsonpath='{.spec.hosts}{"\n"}'
# Si dice app2, este archivo NO lo reemplaza (nombre distinto): conviven, y se conmuta de
# destino por el backendRef del HTTPRoute — moviendo TAMBIÉN audiencia y cache.key (README §5).
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: backend-destino-arqlab
  namespace: poc-egress-kuadrant
spec:
  hosts:
    - "app3.paas-demo.bancogalicia.com.ar"
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: http-for-tls-origination
      protocol: HTTP
      targetPort: 443
