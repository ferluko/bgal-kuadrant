# ORIGEN paas-lab — AuthPolicy del BFF, calcada de echoserver-auth (arqlab,
# Enforced=True, sin EnvoyFilter).
#
#   header app_key  -> Secret.stringData.api_key  (evaluador apiKey)
#   header app_id   -> lo manda el consumidor; Kuadrant NO lo lee. El vínculo
#                      es la label application_id del Secret.
#
# allNamespaces: true como en echoserver-auth. Respuesta JSON en `body`, no
# `message` (ese campo deja text/plain y el cliente no parsea).
#
# NO toca el mint JWT del egreso (02, HTTPRoute egress-backend).
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: bff-lab-apikey
  namespace: poc-egress-kuadrant
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: bff-lab
  rules:
    authentication:
      api-key-authn-bff-lab:
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              application_id: bff-lab
              key-type: app-key
        credentials:
          customHeader:
            name: app_key
    response:
      unauthenticated:
        body:
          value: |-
            {
              "error": "AuthenticationRequired",
              "message": "Authentication parameters missing"
            }
        headers:
          content-type:
            value: application/json
      unauthorized:
        body:
          value: |-
            {
              "error": "InvalidToken",
              "message": "Authentication failed"
            }
        headers:
          content-type:
            value: application/json
---
#   oc --context=paas-lab apply -f origen-paas-lab/18-secret-consumer-bff.yaml
#   oc --context=paas-lab apply -f origen-paas-lab/19-authpolicy-bff-apikey.yaml
#
#   oc --context=paas-lab -n poc-egress-kuadrant get authpolicy bff-lab-apikey \
#     -o jsonpath='Accepted={.status.conditions[?(@.type=="Accepted")].status} Enforced={.status.conditions[?(@.type=="Enforced")].status}{"\n"}'
#
# Consumo (mismo shape que echoserver-b2c):
#
#   curl -sS -D- http://bff-lab.paas-demo.bancogalicia.com.ar/
#     -> 401  {"error":"AuthenticationRequired",...}
#
#   curl -sS -D- -H 'app_id: bff-lab' -H 'app_key: lab-app-key-not-for-prod' \
#     http://bff-lab.paas-demo.bancogalicia.com.ar/
#     -> 200 JSON del BFF
#
#   curl -sS -D- -H 'app_id: bff-lab' -H 'app_key: no' \
#     http://bff-lab.paas-demo.bancogalicia.com.ar/
#     -> 401/403  {"error":"InvalidToken",...}
#
# Si `spec.rules.response.unauthenticated.body` queda vacío tras el apply, el
# CRD de paas-lab no declara `body` (dialecto): avisar, no inventar EnvoyFilter.
