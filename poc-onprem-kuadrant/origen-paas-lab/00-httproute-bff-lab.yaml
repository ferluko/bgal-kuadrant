# ORIGEN paas-lab — ingreso del BFF por openshift-default, NO por gw-hostnet.
#
# Por qué no se reusa gw-hostnet: en arqlab ninguna AuthPolicy sobre ese gateway está
# Enforced, y el cert SDS queda en warming. Sobre openshift-default las AuthPolicy
# sí quedan Enforced (egress-gw, y echoserver-auth en arqlab). Ver
# destino-arqlab/00-DECISION-ingreso.md.
#
# Sin EnvoyFilter. El patrón que ya funciona en el banco (echoserver-auth) usa
# header `app_key` con underscore, sin tocar Envoy.
#
# Si ya existe otra Route con host bff-lab (p.ej. directo al Service bff),
# HostAlreadyClaimed: hay que repuntearla a bff-gw-lab-openshift-default o borrarla.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bff-gw-lab
  namespace: poc-egress-kuadrant
  labels:
    kuadrant.io/gateway: "true"
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-lab
  namespace: poc-egress-kuadrant
spec:
  parentRefs:
    - name: bff-gw-lab
      sectionName: http
  hostnames:
    - "bff-lab.paas-demo.bancogalicia.com.ar"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bff
          port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bff-lab
  namespace: poc-egress-kuadrant
  labels:
    poc.galicia.io/rol: origen-paas-lab
spec:
  host: bff-lab.paas-demo.bancogalicia.com.ar
  to:
    kind: Service
    name: bff-gw-lab-openshift-default
    weight: 100
  port:
    targetPort: 80
  wildcardPolicy: None
---
# Aplicar:
#   oc --context=paas-lab apply -f origen-paas-lab/00-httproute-bff-lab.yaml
#   oc --context=paas-lab -n poc-egress-kuadrant delete envoyfilter bff-gw-lab-allow-underscores --ignore-not-found
#
#   oc --context=paas-lab -n poc-egress-kuadrant get httproute bff-lab \
#     -o jsonpath='{range .status.parents[*]}{.parentRef.name} {range .conditions[*]}{.type}={.status} {end}{"\n"}{end}'
#   oc --context=paas-lab -n poc-egress-kuadrant get route bff-lab \
#     -o jsonpath='HOST={.spec.host} SVC={.spec.to.name} ADMITIDA={.status.ingress[0].conditions[?(@.type=="Admitted")].status}{"\n"}'
