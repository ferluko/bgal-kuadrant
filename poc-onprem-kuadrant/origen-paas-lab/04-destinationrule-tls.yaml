# ORIGEN paas-lab — TLS origination hacia el ingress-gw-lab de arqlab (router default).
#
# HAProxy en passthrough elige backend por SNI. La Route `app3-lab-passthrough` declara
# host=app3…, así que el SNI TIENE que ser app3. Medido 2026-09-09 contra 10.254.28.1:
# SNI=app3 completa el handshake y el Gateway presenta CN=shard1.paas-demo (multi-SAN).
# sni=shard1 no matchea esa Route; host≠sni acá NO es inocuo.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-destino-arqlab-tls
  namespace: poc-egress-kuadrant
spec:
  host: app3.paas-demo.bancogalicia.com.ar
  trafficPolicy:
    # NO ES OPCIONAL. Medido en arqlab (2026-08-06): sin este bloque, con RTT real y
    # concurrencia, Envoy abre y cierra conexiones sin parar -> 503 con response_flags URX,UF y
    # p99 en ~3 RTT. Con el pool: cero errores, p50 en el piso del RTT. No se descubre contra un
    # destino local: con RTT cero, abrir una conexión es gratis y el problema es invisible.
    connectionPool:
      tcp:
        maxConnections: 64
        connectTimeout: 5s
      http:
        # Los 300s del camino a EKS estaban calibrados contra el idle timeout FIJO de 350s del
        # NLB de AWS. Acá no hay NLB: el F5 fronte al DaemonSet hostNetwork y Envoy termina TLS.
        # 300s sigue siendo conservador, pero el número ya no está atado a nada medido —
        # VERIFICAR el idle timeout real del F5 antes de darlo por bueno.
        idleTimeout: 300s
        maxRequestsPerConnection: 0
        h2UpgradePolicy: UPGRADE
    portLevelSettings:
      - port:
          number: 443
        tls:
          mode: SIMPLE
          sni: app3.paas-demo.bancogalicia.com.ar
          # CA interna del banco — el Envoy de arqlab termina TLS con un cert de esa jerarquía,
          # así que sirve el MISMO Secret destino-ca de
          # poc-egress-kuadrant/origen/04-destinationrule-tls.yaml, verbatim.
          #
          # PENDIENTE HEREDADO, no repetir el trabajo: el root correcto tiene SKI
          # 9B:E7:80:85:7F:57:2F:38:49:B1:BE:7C:9D:93:39:14:D0:B2:BC:7E (CN=Root CA Banco
          # Galicia). Verificar por AKI/SKI con openssl, NO por nombre: ya pasó que un cert con
          # nombre plausible no cerraba criptográficamente.
          credentialName: destino-ca
          # Solo para destrabar la primera prueba. NO dejarlo así: sin validación de cadena el
          # TLS protege de escucha pasiva pero no de un MITM.
          # insecureSkipVerify: true
---
# El Secret destino-ca va en el NAMESPACE DONDE CORREN LOS PODS DEL GATEWAY de egreso, que no
# siempre es el de la PoC:
#   oc --context=paas-lab get pods -A -l gateway.networking.k8s.io/gateway-name=egress-gw
