# ORIGEN paas-lab — credencial del consumidor del BFF. Mismo contrato que
# echoserver-auth en arqlab: el Secret lleva labels `application_id` + `key-type`,
# el valor vive en la key `api_key` (nombre FIJO de Authorino, no del header).
#
# Consumo (igual que echoserver):
#   curl -H "app_id: bff-lab" -H "app_key: <stringData.api_key>" http://bff-lab…
#
# `app_id` NO lo valida Kuadrant: selecciona qué Secret indexa la policy (label).
# Authorino solo compara el header `app_key` contra `stringData.api_key`.
#
#   env:
#     - name: APP_ID
#       value: "bff-lab"
#     - name: APP_KEY
#       valueFrom:
#         secretKeyRef: {name: bff-lab-consumer, key: api_key}
apiVersion: v1
kind: Secret
metadata:
  name: bff-lab-consumer
  namespace: poc-egress-kuadrant
  labels:
    authorino.kuadrant.io/managed-by: authorino
    application_id: bff-lab
    key-type: app-key
stringData:
  api_key: "lab-app-key-not-for-prod"
type: Opaque
---
#   oc --context=paas-lab apply -f origen-paas-lab/18-secret-consumer-bff.yaml
