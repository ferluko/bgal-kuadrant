# ORIGEN paas-lab — credencial del consumidor del BFF (PoC, no prod).
#
# Authorino indexa Secrets con:
#   - label authorino.kuadrant.io/managed-by=authorino  (si no, no ve rotaciones)
#   - las labels del selector de la AuthPolicy (19)
#   - campo de datos llamado exactamente `api_key` (nombre fijo del evaluador)
#
# Vive en el mismo ns que la AuthPolicy / AuthConfig (`poc-egress-kuadrant`).
# Authorino en paas-lab es clusterWide, pero no hace falta allNamespaces si el
# Secret está acá.
#
# El consumidor in-cluster levanta las mismas keys y las manda en headers:
#
#   env:
#     - name: API_KEY
#       valueFrom:
#         secretKeyRef: {name: bff-lab-consumer, key: api_key}
#     - name: CLIENT_KEY
#       valueFrom:
#         secretKeyRef: {name: bff-lab-consumer, key: client_key}
#   # curl -H "api_key: $API_KEY" -H "client_key: $CLIENT_KEY" http://bff-lab…
#
# `client_key` va también en annotation: si el objeto identidad de Authorino no
# trae `data` (varía entre versiones), la AuthPolicy 19 compara contra la annotation.
apiVersion: v1
kind: Secret
metadata:
  name: bff-lab-consumer
  namespace: poc-egress-kuadrant
  labels:
    authorino.kuadrant.io/managed-by: authorino
    poc.galicia.io/consumer: bff-lab
  annotations:
    poc.galicia.io/client-key: "lab-client-key-not-for-prod"
stringData:
  api_key: "lab-api-key-not-for-prod"
  client_key: "lab-client-key-not-for-prod"
type: Opaque
---
# Aplicar ANTES que 19 (Authorino indexa el Secret al reconciliar el AuthConfig):
#   oc --context=paas-lab apply -f origen-paas-lab/18-secret-consumer-bff.yaml
