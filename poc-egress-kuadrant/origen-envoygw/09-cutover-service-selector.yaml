# WORKAROUND — SOLO SI EL PROVIDER ES ENVOY GATEWAY, reemplaza al Service de
# arriba. No probado en vivo en este cluster (sin acceso desde esta sesión) —
# ver el mismo workaround, probado parcialmente del lado EKS, en
# poc-ingress-kuadrant/eks-origen-envoygw/09-cutover-service-selector.yaml.
