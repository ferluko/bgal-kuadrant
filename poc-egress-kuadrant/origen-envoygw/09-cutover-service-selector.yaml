#
# En vez de un selector por label (que no cruza namespaces), un Service tipo
# ExternalName: no selecciona pods, es un alias de DNS que SÍ puede apuntar a
# un Service en otro namespace.
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: backend
#   namespace: poc-egress-kuadrant
#   annotations:
#     poc.galicia.io/intercepcion: "egress-gw (envoy gateway, ExternalName)"
# spec:
#   type: ExternalName
#   # <<< Nombre AUTOGENERADO por Envoy Gateway al crear el Gateway — confirmar
#   # el nombre real después de aplicar 01-gateway-egress.yaml:
#   #   oc -n envoy-gateway-system get svc \
#   #     -l gateway.networking.k8s.io/gateway-name=egress-gw -o name
#   externalName: envoy-poc-egress-kuadrant-egress-gw-<hash>.envoy-gateway-system.svc.cluster.local
#   ports:
#     - port: 8080
#
# EL PROBLEMA DE ESTE WORKAROUND: <hash> lo genera el controller, no es
# estable garantizado — si el Gateway se recrea (no solo se actualiza), el
# hash puede cambiar y el ExternalName queda apuntando a un nombre que ya no
# existe, rompiendo el cutover en silencio (DNS que no resuelve, no un error
# visible al aplicar). Mitigación a explorar, sin confirmar: fijar el nombre
# del Service vía el recurso EnvoyProxy (el mismo que fuerza ClusterIP en
# 01-gateway-egress.yaml) — no se confirmó que exponga ese campo.
#
# ROLLBACK — igual que arriba, volver el selector a `app: backend` (el
# ExternalName no vuelve solo, hay que reaplicar el Service original):
#   oc -n poc-egress-kuadrant patch svc backend --type merge -p \
#     '{"spec":{"type":"ClusterIP","selector":{"app":"backend"},"externalName":null}}'
