# FASE 1 — Canary dirigido por header. Cero usuarios reales expuestos.
#
# Sólo los requests que traen `x-canary: true` cruzan al cluster destino; todo lo
# demás se sigue sirviendo localmente. Permite correr la suite funcional y las
# pruebas de los equipos contra el backend migrado, en el camino real de red y
# con el JWT real, sin tocar a ningún consumidor.
#
# Precedencia de Gateway API: una rule con match de header es más específica que
# una de sólo path, así que `canary` gana sin depender del orden del array.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: egress-backend
  namespace: poc-egress-kuadrant
  annotations:
    poc.galicia.io/fase: "1-canary-header"
spec:
  parentRefs:
    - name: egress-gw
      sectionName: mesh-internal
  hostnames:
    - "backend"
    - "backend.poc-egress-kuadrant"
    - "backend.poc-egress-kuadrant.svc"
    - "backend.poc-egress-kuadrant.svc.cluster.local"
  rules:
    - name: canary
      matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: Exact
              name: x-canary
              value: "true"
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: app2.paas-demo.bancogalicia.com.ar
          port: 443
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend-local
          port: 8080
---
# Prueba:
#   oc -n poc-egress-kuadrant exec deploy/bff -- curl -s -H 'x-canary: true' \
#     http://backend.poc-egress-kuadrant.svc.cluster.local:8080/     # -> pod del DESTINO
#   oc -n poc-egress-kuadrant exec deploy/bff -- curl -s -H 'x-canary: true' \
#     http://backend:8080/                                  # -> pod del DESTINO
#   oc -n poc-egress-kuadrant exec deploy/bff -- curl -s \
#     http://backend.poc-egress-kuadrant.svc.cluster.local:8080/     # -> pod LOCAL
#
# Criterio para avanzar a la fase 2: suite funcional completa en verde contra el
# destino, incluyendo casos de error y timeouts.
#
# Rollback: borrar la rule `canary`.
#
# Nota: la AuthPolicy (05) está attacheada al HTTPRoute completo, así que el
# backend local también recibe el header x-egress-token, que ignora. Si se quiere
# acotarla sólo a la rule `canary`, targetearla con sectionName: canary —
# verificar antes que RHCL 1.3 lo soporte sobre HTTPRoute.
