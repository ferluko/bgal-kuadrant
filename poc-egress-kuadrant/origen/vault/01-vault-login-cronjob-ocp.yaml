# Cluster ORIGEN (paas-arqlab, OCP) — hace el login a Vault (auth/jwt-ocp) por fuera de Authorino,
# misma limitación de siempre: Authorino no puede leer su propio SA token y meterlo en el body de
# un POST. Corre con la MISMA ServiceAccount que Authorino (authorino-authorino) — es la identidad
# que Vault espera validar.
#
# DIFERENCIA respecto de la versión EKS (poc-ingress-kuadrant/eks-origen/vault/02-vault-login-cronjob-eks.yaml): el
# mount es auth/jwt-ocp, no auth/jwt. Mount aparte porque el issuer de paas-arqlab
# (https://kubernetes.default.svc) es interno, no alcanzable desde Vault — auth/jwt-ocp usa
# jwt_validation_pubkeys (claves estáticas, sacadas una vez de /openid/v1/jwks) en vez de
# oidc_discovery_url.
#
# CONFIRMADO EN VIVO — 2026-09-02: aplicado, corre cada 30 min, deja el Secret poblado
# correctamente. El mint (Authorino llamando a spiffe/role/egress-gw-ocp/mintjwt) arrancó
# INTERMITENTE por un timeout de 200ms en el ext_authz de Kuadrant — RESUELTO después, sin tocar
# este CronJob: el problema real era el tamaño del cache de Authorino
# (02-authorino-evaluator-cache-size.yaml, mismo directorio), no la latencia en sí. Ver
# 03-authpolicy-origen-ocp.yaml y PROPUESTA-fix-latencia-mint-ocp.md (diseño alternativo,
# archivado, no hizo falta) para el detalle completo.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-egress-login-ocp
  namespace: kuadrant-system
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: authorino-authorino
          restartPolicy: OnFailure
          containers:
            - name: vault-login
              # Placeholder — cualquier imagen con curl + kubectl + jq.
              image: alpine/k8s:1.30.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  RESP=$(curl -sS -X POST \
                    "https://vault-cluster-noprod-private-vault-16d614b5.bc6ede80.z1.hashicorp.cloud:8200/v1/auth/jwt-ocp/login" \
                    -H "X-Vault-Namespace: admin/spiffe" \
                    -d "{\"role\": \"authorino-egress-ocp\", \"jwt\": \"${SA_TOKEN}\"}")
                  CLIENT_TOKEN=$(echo "$RESP" | jq -r '.auth.client_token')
                  if [ -z "$CLIENT_TOKEN" ] || [ "$CLIENT_TOKEN" = "null" ]; then
                    echo "login failed: $RESP" >&2
                    exit 1
                  fi
                  kubectl -n kuadrant-system create secret generic vault-egress-token-ocp \
                    --from-literal=client_token="$CLIENT_TOKEN" \
                    --dry-run=client -o yaml | kubectl apply -f -
---
# RBAC — el ServiceAccount authorino-authorino necesita permiso para crear/actualizar ESTE Secret
# puntual. No dárselo de forma más amplia que esto.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-egress-token-ocp-writer
  namespace: kuadrant-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-egress-token-ocp"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-egress-token-ocp-writer
  namespace: kuadrant-system
subjects:
  - kind: ServiceAccount
    name: authorino-authorino
    namespace: kuadrant-system
roleRef:
  kind: Role
  name: vault-egress-token-ocp-writer
  apiGroup: rbac.authorization.k8s.io
---
# Verificación:
#   oc -n kuadrant-system get secret vault-egress-token-ocp -o jsonpath='{.data.client_token}' | base64 -d
#   oc -n kuadrant-system get cronjob vault-egress-login-ocp
#   oc create job --from=cronjob/vault-egress-login-ocp vault-egress-login-ocp-manual -n kuadrant-system
