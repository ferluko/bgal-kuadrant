# Cluster ORIGEN — TLS origination en el gateway de egreso.
#
# La app manda HTTP plano; el gateway abre TLS contra el cluster destino.
# Esto es lo que hace que el "salto entre clusters" viaje cifrado sin tocar
# una línea de código del bff.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-destino-tls
  namespace: poc-egress-kuadrant
spec:
  # <<< PLACEHOLDER: mismo FQDN que el ServiceEntry
  host: app2.paas-demo.bancogalicia.com.ar
  trafficPolicy:
    # POOL DE CONEXIONES — NO ES OPCIONAL. Medido en paas-arqlab (2026-08-06) contra EKS real.
    #
    # Sin este bloque, con ~170 ms de RTT y concurrencia, Envoy abre y cierra conexiones sin
    # parar: aparecen 503 con response_flags URX,UF (fallo de conexión con reintentos agotados,
    # ~1 s cada uno) y el p99 se va a ~530 ms, que es exactamente 3 RTT — un handshake completo.
    # Con el pool: 55 conexiones para 3829 requests (~70 req por conexión), cx_connect_fail=0,
    # cero errores, p50 en el piso del RTT y 266 req/s sostenidos.
    #
    # Esto NO se puede descubrir contra un destino local: con RTT cero, abrir una conexión es
    # gratis y el problema es invisible. Apareció recién con el destino real.
    connectionPool:
      tcp:
        maxConnections: 64      # ~48 requests en vuelo a 266 req/s; 64 deja aire
        connectTimeout: 5s
      http:
        # 300 s A PROPÓSITO: el idle timeout del NLB de AWS es de 350 s y NO es configurable.
        # Reciclar ANTES que el balanceador evita conexiones medio abiertas y los resets
        # esporádicos que eso produce. No subir de 350 s.
        idleTimeout: 300s
        maxRequestsPerConnection: 0   # 0 = no reciclar la conexión por cantidad de requests
        h2UpgradePolicy: UPGRADE      # sin efecto observado: el upstream sigue en HTTP/1.1
                                      # (52 conexiones activas para ~48 requests en vuelo).
                                      # Se deja porque no molesta; si alguna vez toma, el pool
                                      # se reduce a 1-2 conexiones. Para forzarlo de verdad hay
                                      # que declarar `protocol: HTTP2` en el ServiceEntry (02),
                                      # y ahí HAY QUE VERIFICAR que el x-egress-token se siga
                                      # inyectando antes de darlo por bueno.
    portLevelSettings:
      - port:
          number: 443
        tls:
          mode: SIMPLE
          sni: app2.paas-demo.bancogalicia.com.ar
          # QUÉ CA VA ACÁ depende de dónde termine el TLS en el destino:
          #
          #   NLB en passthrough + Envoy termina con el wildcard del banco
          #   (es lo que hace destino/10)          -> CA INTERNA del banco  <-- recomendado
          #
          #   ALB/NLB terminando con certificado de ACM
          #                                        -> bundle público de Amazon
          #
          # La primera opción mantiene el mismo modelo de confianza que on-prem y no
          # introduce una CA nueva; por eso destino/10 NO usa ACM.
          #
          # El Secret debe existir en el NAMESPACE DONDE CORREN LOS PODS DEL GATEWAY:
          #   oc get pods -A -l gateway.networking.k8s.io/gateway-name=egress-gw
          credentialName: destino-ca
          # Sólo PoC, si todavía no tenés la CA a mano: comentar credentialName y
          # descomentar la línea siguiente. NO dejarlo así para producción: sin
          # validación de cadena, el TLS protege de escucha pasiva pero no de un MITM.
          # insecureSkipVerify: true
---
# Creación del Secret con la CA:
#   oc -n <ns-del-dataplane-del-gateway> create secret generic destino-ca \
#     --from-file=ca.crt=./ca-interna-galicia.pem
#
# El `sni` es lo que hace que todo esto funcione sin reescribir el Host: el request
# viaja con Host: backend.poc-egress-kuadrant.svc.cluster.local pero abre TLS anunciando
# app2.paas-demo.bancogalicia.com.ar, que es lo que el NLB/Envoy del destino esperan
# y lo que el certificado wildcard cubre.
kind: Secret
apiVersion: v1
metadata:
  name: destino-ca
  namespace: poc-egress-kuadrant
data:
  ca.crt: 
  cacert: 
type: Opaque