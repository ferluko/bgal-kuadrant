# Cluster ORIGEN (paas-arqlab) — Gateway de egreso dedicado.
#
# Vive en el mismo namespace que la app para que el "secreto de firma" quede
# local al ns (requisito: Authorino sólo lee Secrets del ns del AuthConfig).
#
# El listener es HTTP:8080 porque el cliente (bff) sigue hablando texto plano
# contra "backend.poc-egress-kuadrant.svc.cluster.local:8080". El TLS hacia el cluster
# destino lo origina el gateway (ver 04-destinationrule-tls.yaml).
#
# La label kuadrant.io/gateway: "true" es la que habilita a Kuadrant/RHCL a
# gestionar políticas sobre este Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egress-gw
  namespace: poc-egress-kuadrant
  labels:
    kuadrant.io/gateway: "true"
  annotations:
    # OBLIGATORIO. El controller genera un Service LoadBalancer por defecto, lo que
    # en este cluster implica dos cosas malas:
    #   1. EXTERNAL-IP <pending> permanente: no hay proveedor de LB (IPI vSphere,
    #      el VIP de ingress es keepalived atado a HAProxy).
    #   2. Se asignan nodePorts -> el gateway de EGRESO queda alcanzable desde
    #      fuera del cluster. Y su AuthPolicy autentica con `anonymous`: cualquiera
    #      que llegue a ese nodePort obtendría un JWT firmado. La NetworkPolicy (07)
    #      lo tapa, pero la exposición no debería existir.
    # Un gateway de egreso sólo tiene que ser alcanzable desde adentro.
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: mesh-internal
      protocol: HTTP
      port: 8080
      # Sin hostname: las HTTPRoutes definen las variantes admitidas del Host
      # (FQDN y formas abreviadas como `backend`). Restringir este listener al
      # FQDN impediría atender esas variantes, aunque figuren en la route.
      allowedRoutes:
        namespaces:
          from: Same
---
# Verificación:
#   oc -n poc-egress-kuadrant get gateway egress-gw \
#     -o jsonpath='{.status.conditions[?(@.type=="Programmed")].message}{"\n"}'
#
#   # los pods DEBEN quedar en este namespace: es lo que permite que el Service
#   # backend los seleccione en el cutover (09). Si caen en openshift-ingress,
#   # usar alternativas/interceptacion-externalname.yaml.
#   oc -n poc-egress-kuadrant get pods -l gateway.networking.k8s.io/gateway-name=egress-gw
#   oc -n poc-egress-kuadrant get svc  -l gateway.networking.k8s.io/gateway-name=egress-gw
#
# El Service DEBE salir TYPE=ClusterIP y sin nodePorts. Si sale LoadBalancer, ver
# la variante con infrastructure.parametersRef en 00-smoke-wristband/01-gateway-smoke.yaml.
#
# Nota: con el controller openshift-default el Service suele llamarse
#   <gateway>-<gatewayclass>  ->  egress-gw-openshift-default
# (mismo patrón que gw-one-openshift-default observado en connlink).
# Si el Service se provisiona como LoadBalancer, igual es alcanzable in-cluster
# por su ClusterIP/nombre DNS; no hace falta exponerlo afuera.
