# Cluster ORIGEN (paas-arqlab, OCP) — mismo patrón que
# poc-ingress-kuadrant/vault-emisor-spiffe/13-vault-login-cronjob.yaml (EKS), roles invertidos.
# Hace el login a Vault (auth/jwt-ocp) por fuera de Authorino, por la misma limitación real:
# Authorino no tiene forma nativa de leer su propio SA token y meterlo en el body de un POST. Corre
# con la MISMA ServiceAccount que Authorino (authorino-authorino) — confirmado en vivo que es esa,
# no una de "egress-gw".
#
# DIFERENCIA CLAVE respecto de la versión EKS: el mount es auth/jwt-ocp, no auth/jwt. Tuvo que ser
# un mount aparte porque el issuer de paas-arqlab es "https://kubernetes.default.svc" — una
# dirección INTERNA del cluster, no alcanzable desde Vault (a diferencia del issuer público de EKS
# vía IRSA). Por eso auth/jwt-ocp está configurado con jwt_validation_pubkeys (claves estáticas,
# sacadas una sola vez de /openid/v1/jwks) en vez de oidc_discovery_url — no depende de que Vault
# pueda alcanzar la red interna de OCP en cada login. Ver vault-emisor-spiffe.md para el detalle
# completo de por qué y cómo se armó.
#
# CONFIRMADO EN VIVO — 2026-09-02: login real con el SA token de un pod de authorino-authorino en
# paas-arqlab contra auth/jwt-ocp/login (role authorino-egress-ocp) -> 200, con la policy acotada
# correcta; mint contra spiffe/role/egress-gw-ocp/mintjwt con ese client_token -> 200, JWT-SVID
# real (sub: spiffe://poc-egress.bancogalicia.com.ar/paas-arqlab/egress-gw). Falta aplicar ESTE
# CronJob en vivo — no se pudo desde esta sesión (sin acceso CLI a OCP, solo consola).
#
# Frecuencia: cada 30 min (mismo fix aplicado del lado EKS — "*/50" NO es "cada 50 minutos", corre
# en los minutos 0 y 50 de cada hora, intervalo irregular). TTL del token de Vault: 3600s (1h).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-egress-login-ocp
  namespace: kuadrant-system
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: authorino-authorino
          restartPolicy: OnFailure
          containers:
            - name: vault-login
              # Placeholder — cualquier imagen con curl + kubectl + jq. Confirmar que oc/kubectl
              # esté disponible en la imagen elegida para este cluster.
              image: alpine/k8s:1.30.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  RESP=$(curl -sS -X POST \
                    "https://vault-cluster-noprod-private-vault-16d614b5.bc6ede80.z1.hashicorp.cloud:8200/v1/auth/jwt-ocp/login" \
                    -H "X-Vault-Namespace: admin/spiffe" \
                    -d "{\"role\": \"authorino-egress-ocp\", \"jwt\": \"${SA_TOKEN}\"}")
                  CLIENT_TOKEN=$(echo "$RESP" | jq -r '.auth.client_token')
                  if [ -z "$CLIENT_TOKEN" ] || [ "$CLIENT_TOKEN" = "null" ]; then
                    echo "login failed: $RESP" >&2
                    exit 1
                  fi
                  kubectl -n kuadrant-system create secret generic vault-egress-token-ocp \
                    --from-literal=client_token="$CLIENT_TOKEN" \
                    --dry-run=client -o yaml | kubectl apply -f -
---
# RBAC — mismo alcance mínimo que del lado EKS: solo este Secret puntual.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-egress-token-ocp-writer
  namespace: kuadrant-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-egress-token-ocp"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-egress-token-ocp-writer
  namespace: kuadrant-system
subjects:
  - kind: ServiceAccount
    name: authorino-authorino
    namespace: kuadrant-system
roleRef:
  kind: Role
  name: vault-egress-token-ocp-writer
  apiGroup: rbac.authorization.k8s.io
---
# Verificación (desde consola OCP, o oc si hay CLI):
#   oc -n kuadrant-system get secret vault-egress-token-ocp -o jsonpath='{.data.client_token}' | base64 -d
#   oc -n kuadrant-system get cronjob vault-egress-login-ocp
#
# Como con el de EKS: correr un Job manual una vez para no esperar el próximo horario:
#   oc create job --from=cronjob/vault-egress-login-ocp vault-egress-login-ocp-manual -n kuadrant-system
