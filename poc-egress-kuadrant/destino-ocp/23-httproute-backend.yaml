# Cluster DESTINO OCP — ruta al backend remoto. Idéntico a `sim-destino/03` y a
# `destino/12`, sin un solo campo cambiado.
#
# SIN `hostnames`, a propósito y por dos motivos que se refuerzan:
#   1. El listener del Gateway (21) tampoco declara `hostname`, así que la route hereda y
#      matchea cualquier Host.
#   2. El egreso NO reescribe el Host (README §4): el request llega con
#      `Host: backend.poc-egress-kuadrant.svc.cluster.local:8080` aunque el SNI haya sido
#      `app2.paas-demo.bancogalicia.com.ar`. Si acá se declarara el FQDN público la route
#      no engancharía, y el síntoma sería un 404 del destino — que se lee como un problema
#      de ruteo cuando en realidad es de diseño.
#
# OJO con el Host CON PUERTO. El cliente manda `...:8080` (README §7.1 / H4). Con la route
# sin `hostnames` da igual, pero si algún día se declaran, hay que declarar las dos formas.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: echoserver
spec:
  parentRefs:
    - name: ingress-gw
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8080
---
# Verificación:
#   oc -n echoserver get httproute backend \
#     -o jsonpath='{range .status.parents[*]}{range .conditions[*]}{.type}={.status}({.reason}) {end}{"\n"}{end}'
#   -> Accepted=True ResolvedRefs=True, y después kuadrant.io/AuthPolicyAffected=True al aplicar 25
