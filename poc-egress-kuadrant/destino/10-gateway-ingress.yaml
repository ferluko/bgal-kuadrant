# Cluster DESTINO (EKS) — Gateway de ingreso que recibe el tráfico migrado.
#
# app2.paas-demo.bancogalicia.com.ar  --CNAME-->  <nlb>.elb.<region>.amazonaws.com
#
# DIFERENCIAS respecto de un destino OpenShift:
#  - gatewayClassName: `istio` (Istio upstream instalado en EKS), no `openshift-default`.
#  - El Service SÍ debe ser LoadBalancer: en EKS hay proveedor real (a diferencia del
#    origen IPI vSphere, donde el LB queda <pending> y por eso el egress va ClusterIP).
#  - En Istio upstream la copia de labels/annotations del Gateway a los recursos
#    generados está habilitada por defecto (al revés que el istiod gestionado de OCP),
#    así que las annotations del AWS Load Balancer Controller llegan al Service.
#    Verificarlo igual: oc/kubectl get svc -l gateway.networking.k8s.io/gateway-name=ingress-gw -o yaml
apiVersion: v1
kind: Namespace
metadata:
  name: echoserver
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress-gw
  namespace: echoserver
  labels:
    # Necesaria para que Kuadrant gestione políticas sobre este Gateway (Opción B,
    # el camino recomendado). Inofensiva si se usa la Opción A (Istio a secas).
    kuadrant.io/gateway: "true"
  annotations:
    networking.istio.io/service-type: LoadBalancer
    # NLB en modo pasarela L4: el TLS lo termina Envoy, NO el balanceador.
    # Es lo que mantiene el modelo de confianza igual al del diseño on-prem:
    # el origen valida el certificado del gateway, no uno de ACM.
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # `internal` = alcanzable por Direct Connect / VPN desde el datacenter.
    # Cambiar a `internet-facing` sólo si el tráfico origen→destino sale a internet,
    # lo que además obliga a revisar el proxy corporativo (ver origen/02).
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      # SIN hostname, a propósito: el origen NO reescribe el Host (ver
      # origen/03-httproute-egress.yaml), así que el request llega con
      # Host: backend.poc-egress-kuadrant.svc.cluster.local. El listener matchea cualquier
      # SNI y sirve el cert; el SNI (app2.paas-demo...) lo fija el DestinationRule
      # del origen, independiente del header Host.
      #
      # Contrapartida: este listener es catch-all. Es aceptable en un gateway
      # DEDICADO a este flujo. Si se comparte y el hostname pasa a ser obligatorio,
      # hay que volver a poner el URLRewrite en el origen y renunciar al split por
      # peso (ver README §6bis).
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: paas-demo-wildcard-tls
---
# Certificado: el wildcard *.paas-demo.bancogalicia.com.ar cubre bff y app2
# (un solo nivel de subdominio), así que sirve el mismo cert del banco en ambos
# lados. Cargarlo como Secret TLS en el ns del Gateway:
#
#   kubectl -n echoserver create secret tls paas-demo-wildcard-tls \
#     --cert=wildcard.paas-demo.bancogalicia.com.ar.crt \
#     --key=wildcard.paas-demo.bancogalicia.com.ar.key
#
# NO usar ACM aquí: si el balanceador terminara TLS, el origen validaría un
# certificado emitido por Amazon en vez del del banco, y habría que cambiar el
# `credentialName` del DestinationRule (origen/04) por el bundle público de AWS.
# Es una decisión válida, pero hay que tomarla explícitamente.
#
# DNS a crear:
#   app2.paas-demo.bancogalicia.com.ar.  CNAME  <nombre-dns-del-nlb>
#   kubectl -n echoserver get svc -l gateway.networking.k8s.io/gateway-name=ingress-gw \
#     -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}{"\n"}'
#
# Con NLB `internal`, ese hostname resuelve a IPs privadas: el DNS corporativo tiene
# que poder resolver la zona de AWS (forwarding a Route53 Resolver o zona privada
# compartida). Verificar desde el cluster ORIGEN, no sólo desde el bastión.
#
# Verificación:
#   kubectl -n echoserver get gateway ingress-gw \
#     -o jsonpath='{.status.conditions[?(@.type=="Programmed")].message}{"\n"}'
#
# Y confirmar que el certificado LLEGÓ al proxy (ResolvedRefs=True no lo prueba —
# ver el bloqueo de SDS del runbook de ingress §7.2):
#   istioctl proxy-config secret deploy/ingress-gw-istio -n echoserver
