# SMOKE TEST — ruta al backend local, que refleja los headers recibidos.
#
# El echo server es la instrumentación: lo que aparezca en su respuesta es
# literalmente lo que el gateway le mandó al upstream. Es la única forma de
# comprobar que el wristband se inyectó, sin mirar logs de Envoy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke-wristband
  namespace: poc-egress-kuadrant
spec:
  parentRefs:
    - name: smoke-gw
      sectionName: http
  hostnames:
    - "smoke.egress.local"
  rules:
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8080
---
# Nota: apunta al Service `backend` con su selector ORIGINAL (app: backend).
# Este smoke test se corre ANTES del cutover, así que no hay riesgo de loop.
